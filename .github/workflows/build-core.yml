name: Reusable cloud studio build
on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12.8'
      - run: pip install -r requirements.lock
      - run: bash ci/setup.sh
      - run: python ci/suite_check.py
      - run: python ci/template_matrix.py
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python ci/matrix_regression.py
        if: inputs.stage == 'matrix'
      - run: python ci/official_sources.py
        if: inputs.stage == 'sources'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: template-${{ inputs.stage }}
          path: build/
          retention-days: 30
