name: Document task
run-name: 'Document task: ${{ inputs.task_id }}'
on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      input_commit:
        required: true
        type: string
      request_path:
        required: true
        type: string
      phase:
        required: true
        type: choice
        options: [reference, review, model-review, md-review, template-build, export, word-export, visual, visual-receipt, package]
      artifact_run:
        type: string
        default: ''
      artifact_name:
        type: choice
        default: document-task
        options: [document-task, skill-delivery, review-delivery, template-matrix]
permissions:
  contents: read
  actions: read
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: '${{ inputs.input_commit }}'
          path: task-inputs
          persist-credentials: false
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12.8'
      - run: pip install -r requirements.lock
      - id: word-pin
        if: inputs.phase == 'word-export'
        run: echo "commit=$(python -c 'import json; print(json.load(open("catalog/word-engine.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.phase == 'word-export'
        with:
          repository: Self-Command/word-module-studio
          ref: ${{ steps.word-pin.outputs.commit }}
          path: .word-engine
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: inputs.phase == 'word-export'
        with:
          dotnet-version: '10.0.100'
      - run: bash ci/bootstrap.sh && bash ci/render-bootstrap.sh
        if: inputs.phase == 'word-export'
        working-directory: .word-engine
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: inputs.phase != 'visual' && inputs.phase != 'visual-receipt'
        with:
          path: .tool-downloads
          key: rps-linux-pinned-tools-${{ hashFiles('ci/setup.sh') }}
          restore-keys: rps-linux-pinned-tools-
      - run: bash ci/setup.sh
        if: inputs.phase != 'visual' && inputs.phase != 'visual-receipt' && inputs.phase != 'word-export'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.phase == 'visual' || inputs.phase == 'visual-receipt'
        with:
          name: '${{ inputs.artifact_name }}'
          run-id: '${{ inputs.artifact_run }}'
          github-token: '${{ github.token }}'
          path: visual-artifacts
      - name: Process declared inputs
        env:
          REQUEST_PATH: '${{ inputs.request_path }}'
          INPUT_COMMIT: '${{ inputs.input_commit }}'
          TASK_ID: '${{ inputs.task_id }}'
          PHASE: '${{ inputs.phase }}'
          ARTIFACT_RUN: '${{ inputs.artifact_run }}'
          WMS_ENGINE_ROOT: '${{ github.workspace }}/.word-engine'
        run: |
          python scripts/ci_run.py --input-root task-inputs --request "$REQUEST_PATH" --output build/task --artifact-root visual-artifacts --artifact-run "$ARTIFACT_RUN"
          git rev-parse HEAD > build/skill-commit.txt
          printf '%s\n' "$INPUT_COMMIT" > build/input-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: document-task
          path: build/
          retention-days: 30
