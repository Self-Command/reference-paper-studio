name: Document task
run-name: 'Document task: ${{ inputs.task_id }}'
on:
  workflow_dispatch:
    inputs:
      task_id:
        required: true
        type: string
      input_commit:
        required: true
        type: string
      request_path:
        required: true
        type: string
      phase:
        required: true
        type: choice
        options: [reference, review, model-review, md-review, template-build, export, visual, visual-receipt]
      artifact_run:
        type: string
        default: ''
      artifact_name:
        type: choice
        default: document-task
        options: [document-task, skill-delivery]
permissions:
  contents: read
  actions: read
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: '${{ inputs.input_commit }}'
          path: task-inputs
          persist-credentials: false
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12.8'
      - run: pip install -r requirements.lock
      - run: bash ci/setup.sh
        if: inputs.phase != 'visual' && inputs.phase != 'visual-receipt'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: inputs.phase == 'visual' || inputs.phase == 'visual-receipt'
        with:
          name: '${{ inputs.artifact_name }}'
          run-id: '${{ inputs.artifact_run }}'
          github-token: '${{ github.token }}'
          path: visual-artifacts
      - name: Process declared inputs
        env:
          REQUEST_PATH: '${{ inputs.request_path }}'
          INPUT_COMMIT: '${{ inputs.input_commit }}'
          TASK_ID: '${{ inputs.task_id }}'
          PHASE: '${{ inputs.phase }}'
          ARTIFACT_RUN: '${{ inputs.artifact_run }}'
        run: |
          python scripts/ci_run.py --input-root task-inputs --request "$REQUEST_PATH" --output build/task --artifact-root visual-artifacts --artifact-run "$ARTIFACT_RUN"
          git rev-parse HEAD > build/skill-commit.txt
          printf '%s\n' "$INPUT_COMMIT" > build/input-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: document-task
          path: build/
          retention-days: 30
