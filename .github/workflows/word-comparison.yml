name: Word template comparison
on:
  workflow_dispatch:
    inputs:
      baseline_run:
        description: Successful skill CI run for the unchanged model
        required: true
        default: '37863960356'
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASELINE_RUN: ${{ inputs.baseline_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12.8'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.14.0'
      - run: pip install -r requirements.lock
      - run: bash ci/setup.sh
      - run: gh run download "$BASELINE_RUN" --repo "$GITHUB_REPOSITORY" --name skill-delivery --dir build/baseline
      - name: Lock JavaScript dependencies in Actions
        working-directory: experiments/docx9
        run: npm install --package-lock-only --ignore-scripts && npm ci --ignore-scripts
      - run: python ci/word_comparison.py prepare
      - run: node experiments/docx9/fill-template.mjs build/word-comparison/model
      - run: node experiments/docx9/fill-template.mjs build/word-comparison/objects-end
      - run: python ci/word_comparison.py verify
      - name: Check cloud-only boundaries inside Actions
        run: |
          env -u GITHUB_ACTIONS -u GITHUB_RUN_ID node experiments/docx9/fill-template.mjs > build/node-boundary.txt 2>&1 && exit 1 || grep -q CLOUD_ONLY build/node-boundary.txt
          env -u GITHUB_ACTIONS -u GITHUB_RUN_ID python ci/word_comparison.py > build/python-boundary.txt 2>&1 && exit 1 || grep -q CLOUD_ONLY build/python-boundary.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: word-comparison
          path: |
            build/word-comparison/
            experiments/docx9/package-lock.json
            build/*-boundary.txt
            build/libreoffice-version.txt
            build/pandoc-version.txt
          retention-days: 30
