name: Skill CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      stage:
        type: choice
        default: full
        options: [core, modular, matrix, sources, diagnose, master, full]
      source_run:
        type: string
        default: ''
      source_artifact:
        type: choice
        default: skill-delivery
        options: [skill-delivery, template-matrix]
permissions:
  contents: read
jobs:
  validate:
    if: inputs.stage != 'matrix' && inputs.stage != 'sources' && inputs.stage != 'diagnose'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12.8'
      - run: pip install -r requirements.lock
      - run: bash ci/setup.sh
        if: inputs.stage != 'master' && inputs.stage != 'core'
      - run: python ci/suite_check.py
      - run: python ci/template_matrix.py
        if: inputs.stage == 'modular'
      - run: python -m pytest tests/test_suite_core.py -q --junitxml=build/suite-tests.xml
        if: inputs.stage == 'core'
      - run: python ci/validate_skill.py
      - run: python ci/template_build.py
        if: inputs.stage != 'core'
      - run: python -m pytest tests/test_locked_template.py -k 'not latex_layout_commands' -q --junitxml=build/template-tests.xml
        if: inputs.stage == 'master'
      - run: python -m pytest -q --junitxml=build/test-results.xml
        id: tests
        if: inputs.stage != 'master' && inputs.stage != 'core'
      - run: python ci/modular_regression.py
        if: inputs.stage == 'modular'
      - run: python ci/probe_math.py
        if: inputs.stage != 'master' && inputs.stage != 'core'
      - run: python ci/regression.py
        id: regression
        if: inputs.stage != 'master' && inputs.stage != 'core' && inputs.stage != 'modular'
      - run: python ci/package.py
        if: always() && inputs.stage != 'master' && inputs.stage != 'core' && steps.tests.outcome == 'success'
      - run: git rev-parse HEAD > build/skill-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: diagnostic-preview
          path: |
            build/model/previews/word-compat-proof/*.png
            build/objects-end/previews/word-compat-proof/*.png
            build/model/acceptance.json
            build/model/manuscript.docx
            build/model/word-document.xml
            build/model/isolated-math-proof/glyph-preservation.json
            build/model/math-layout-ledger.json
            build/model/inline-math-layout-ledger.json
            build/model/word-column-geometry.json
            build/model/latex-column-geometry.json
            build/model/equation-visibility.json
            build/model/latex/main.tex
            build/model/latex/body.tex
            build/libreoffice-version.txt
            build/pandoc-version.txt
            build/probe/comparison.png
            build/probe/continuations.json
            build/probe/continuation-*.png
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: review-delivery
          path: |
            build/modular-model-*/manuscript.docx
            build/modular-model-*/*proof.pdf
            build/modular-model-*/previews/
            build/modular-model-*/acceptance.json
            build/modular-model-*/content-report.json
            build/modular-model-*/equation-alignment.json
            build/modular-model-*/latex/main.tex
            build/modular-model-*/fixture-changes.json
            build/modular-input-*/fixture-changes.json
            build/modular-regression.json
            build/test-results.xml
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: skill-delivery
          path: build/
          retention-days: 30
  templates:
    if: inputs.stage == 'matrix' || inputs.stage == 'sources'
    uses: ./.github/workflows/build-core.yml
    with:
      stage: ${{ inputs.stage }}
  diagnose:
    if: inputs.stage == 'diagnose'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12.8'
      - run: pip install -r requirements.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: '${{ inputs.source_artifact }}'
          run-id: '${{ inputs.source_run }}'
          github-token: '${{ github.token }}'
          path: diagnostic-artifacts
      - run: python ci/diagnose_artifacts.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: proof-diagnostics
          path: build/
          retention-days: 30
