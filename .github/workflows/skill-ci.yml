name: Skill CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
      - uses: actions/setup-python@06da6279cdbca41027908073e81a4544dc79c06b
        with:
          python-version: '3.12.8'
      - run: pip install -r requirements.lock
      - run: bash ci/setup.sh
      - run: python ci/validate_skill.py
      - run: python -m pytest -q --junitxml=build/test-results.xml
      - run: python ci/regression.py
      - run: python ci/package.py
      - run: git rev-parse HEAD > build/skill-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: skill-delivery
          path: build/
          retention-days: 30
